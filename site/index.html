*{box-sizing:border-box}html,body{margin:0;height:100%}

<body>
<form class="c" id="f">
<img src="/a/6d0fd2687e0f4e908cbe7777ef1d6bd1.webp" alt="Fanball">
<h1>League Management Prototype</h1>
<p>A clickable design prototype. Enter the passcode you were given.</p>
<label for="pc">PASSCODE</label>
<input id="pc" type="password" autocomplete="current-password" autofocus>
<button type="submit">Enter</button>
<div class="e" id="e"></div>
<small>Sample data only. Nothing you do here is saved to a real league or moves real money.</small>
</form>
<script>
var H='6f2e1db94e3a0e0b587bc63620d0cf2040414f6ce61d8d7f74292bf4d3b9b9b5';
if(localStorage.getItem('lmp_ok')){go();}
function go(){var n=new URLSearchParams(location.search).get('next');location.replace(n&&n.charAt(0)==='/'&&n.charAt(1)!=='/'?n:'/home');}
document.getElementById('f').addEventListener('submit',async function(ev){ev.preventDefault();
var v=document.getElementById('pc').value.trim().toLowerCase();
var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
var h=Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
if(h===H){localStorage.setItem('lmp_ok','1');go();}else{document.getElementById('e').textContent='That passcode isn’t right.';}});
</script>
